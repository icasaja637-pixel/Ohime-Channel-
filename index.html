<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome to Ohime Channel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e1e2f, #2b2b45);
            color: white;
            text-align: center;
        }
        header {
            padding: 40px 20px;
        }
        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            color: #ccc;
        }
        .container {
            padding: 20px;
        }
        .game-card {
            background: #2f2f4f;
            margin: 20px auto;
            padding: 20px;
            border-radius: 12px;
            width: 300px;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
        }
        .game-card h3 {
            margin-top: 0;
        }
        .download-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: #ff4da6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }
        .download-btn:hover {
            background: #ff1a8c;
        }
        footer {
            margin-top: 40px;
            padding: 20px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

<header>
    <h1>Welcome to Ohime Channel</h1>
    <p>Your place to download private server games</p>
</header>

<div class="container">

    <div class="game-card">
        <h3>Game Name 1</h3>
        <p>Private Server Version</p>
        <a href="#" class="download-btn">Download</a>
    </div>

    <div class="game-card">
        <h3>Game Name 2</h3>
        <p>Private Server Version</p>
        <a href="#" class="download-btn">Download</a>
    </div>

    <div class="game-card">
        <h3>Game Name 3</h3>
        <p>Private Server Version</p>
        <a href="#" class="download-btn">Download</a>
    </div>

</div>

<footer>
    © 2026 Ohime Channel | All Rights Reserved
</footer>

</body>
</html>
